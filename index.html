<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warships Online</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#0b1a2b;--panel:#12263d;--text:#e9f1f8;--muted:#8fa7bd;--accent:#3fb6a8}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(circle at top,#173251,var(--bg) 70%);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
h1{margin:6px 0 2px;letter-spacing:4px;font-size:1.8rem}
.status{min-height:1.5em;margin:8px 0 12px;color:var(--muted);text-align:center;font-size:1.05rem}
.status.hot{color:var(--accent);font-weight:700}
.panel{background:var(--panel);border-radius:14px;padding:22px;max-width:420px;width:100%;text-align:center;box-shadow:0 8px 30px #0006}
.muted{color:var(--muted)}
.or{margin:16px 0 8px;color:var(--muted);font-size:.9rem}
label{display:block;margin-bottom:6px}
button{background:var(--accent);color:#04201c;border:0;border-radius:8px;padding:10px 16px;font-size:1rem;font-weight:700;cursor:pointer;margin:4px}
button.secondary{background:#2b4a6b;color:var(--text)}
button:disabled{opacity:.4;cursor:default}
input{padding:10px;font-size:1.1rem;border-radius:8px;border:0;text-align:center}
#codeIn{width:130px;text-transform:uppercase;letter-spacing:3px}
#nameIn{width:min(100%,240px);margin-bottom:14px}
.code{font-size:2.4rem;letter-spacing:8px;font-weight:800;color:var(--accent);margin:6px 0 10px}
.score{text-align:center;color:var(--muted);margin-bottom:10px;font-weight:600}
.boards{display:flex;gap:28px;flex-wrap:wrap;justify-content:center}
.board-wrap h3{margin:0 0 6px;text-align:center;font-weight:600;color:var(--muted);font-size:1rem}
.board-wrap.dim{opacity:.35;pointer-events:none}
.grid{--cell:min(8.2vw,34px);display:grid;grid-template-columns:repeat(10,var(--cell));grid-template-rows:repeat(10,var(--cell));gap:2px;background:#0a1626;padding:3px;border-radius:6px;user-select:none}
.cell{background:linear-gradient(135deg,#1b3b5c,#22486f);border-radius:3px;position:relative;transition:background .15s}
.cell.preview{background:#3fb6a855}
.cell.bad{background:#e8553b88}
.cell.target{cursor:crosshair}
.cell.target:hover{background:#2a5580;box-shadow:inset 0 0 0 2px var(--accent)}
.cell.pending{background:#2a5580;animation:pulse .5s infinite alternate}
.cell.hit,.cell.miss,.cell.sunk{z-index:2}
.cell.hit{background:#e8553bb3}
.cell.sunk{background:#5a120a73}
.cell.miss::after{content:"";position:absolute;inset:36%;border-radius:50%;background:#cfe3f5;opacity:.85}
.cell.hit::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:900;font-size:calc(var(--cell)*.6);text-shadow:0 0 4px #000}
.cell.sunk::after{color:#ffb3a6}
.shipart{z-index:1;pointer-events:none;display:flex}
.shipart svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 1px 1.5px #000a)}
.shipart.sunk svg{filter:grayscale(.6) brightness(.75)}
.shipart.ghost{opacity:.7}
@keyframes pulse{to{background:var(--accent)}}
.fleet{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-top:7px;font-size:.78rem;max-width:360px}
.fleet span{background:#1f3a58;padding:2px 8px;border-radius:10px}
.fleet .gone{text-decoration:line-through;opacity:.35}
.controls{text-align:center;margin-top:14px}
.over{font-size:1.6rem;font-weight:800;margin-bottom:6px}
.log{text-align:center;margin-top:10px;min-height:1.4em;font-weight:600}
</style>
</head>
<body>
<h1>⚓ WARSHIPS</h1>
<div id="status" class="status">Play Battleships online with a friend</div>

<div id="lobby" class="panel">
  <div id="menu">
    <label for="nameIn" class="muted">Your name</label>
    <input id="nameIn" maxlength="14" placeholder="Captain…" autocomplete="off">
    <p>Sink your friend's fleet before they sink yours.</p>
    <button id="hostBtn">Create game</button>
    <div class="or">or join with a code</div>
    <input id="codeIn" maxlength="5" placeholder="CODE"> <button id="joinBtn" class="secondary">Join</button>
  </div>
  <div id="hostBox" hidden>
    <p class="muted">Your room code</p>
    <div id="code" class="code"></div>
    <button id="copyBtn">Copy invite link</button>
    <p class="muted">Waiting for your friend to join…</p>
  </div>
</div>

<div id="game" hidden>
  <div id="score" class="score"></div>
  <div class="boards">
    <div class="board-wrap"><h3 id="myTitle">Your fleet</h3><div id="mine" class="grid"></div><div id="myFleet" class="fleet"></div></div>
    <div class="board-wrap" id="enemyWrap"><h3 id="enemyTitle">Enemy waters</h3><div id="enemy" class="grid"></div><div id="enemyFleet" class="fleet"></div></div>
  </div>
  <div id="placeCtrls" class="controls">
    <button id="rotBtn" class="secondary">Rotate (R)</button>
    <button id="randBtn" class="secondary">Random</button>
    <button id="clearBtn" class="secondary">Clear</button>
    <button id="readyBtn" disabled>Ready!</button>
  </div>
  <div id="overBox" class="controls" hidden><div id="overMsg" class="over"></div><button id="againBtn">Play again</button></div>
  <div id="log" class="log"></div>
</div>

<script>
const N=10,SHIPS=[5,4,3,3,2],NAMES=['Carrier','Battleship','Cruiser','Submarine','Destroyer'];
const $=id=>document.getElementById(id);
const grid=v=>Array.from({length:N},()=>Array(N).fill(v));
let peer=null,conn=null,isHost=false,phase='lobby';
let myName='You',oppName='Friend';
let myGrid=null,incoming,enemy,ships=[],enemyShips=[],placingIdx=0,horiz=true,hover=null;
let myReady=false,oppReady=false,myTurn=false,iStart=true;
let score={me:0,them:0};

function setStatus(t,hot){const s=$('status');s.textContent=t;s.className='status'+(hot?' hot':'')}
function log(t){$('log').textContent=t}
function send(m){if(conn&&conn.open)conn.send(m)}
function makeCode(){const a='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=a[Math.floor(Math.random()*a.length)];return s}

/* ---------- Ship art (SVG, drawn pointing right; rotated for vertical) ---------- */
const svgCache={};
function turret(x){return `<rect x="${x}" y="4.45" width="3.4" height="1.1" rx=".3" fill="#25303a"/><circle cx="${x}" cy="5" r="1.6" fill="#3e4c59" stroke="#cdd6de" stroke-width=".3"/>`}
function bridge(x,w){return `<rect x="${x}" y="3" width="${w}" height="4" rx=".7" fill="#dfe6ec"/><rect x="${x+w-1.2}" y="3.6" width=".6" height="2.8" fill="#3a5873"/>`}
function hull(W,fill){return `<path d="M1.5,5 C1.5,2 3,1.6 6,1.6 L${W-9},1.6 C${W-4},1.6 ${W-1},3.5 ${W-.6},5 C${W-1},6.5 ${W-4},8.4 ${W-9},8.4 L6,8.4 C3,8.4 1.5,8 1.5,5Z" fill="${fill}" stroke="#d9e2ea" stroke-width=".35"/><path d="M5,5 L${W-6},5" stroke="#fff" stroke-width=".25" opacity=".35"/>`}
function shipSVG(i,vert){
  const key=i+(vert?'v':'h');if(svgCache[key])return svgCache[key];
  const W=SHIPS[i]*10;let s='';
  if(i===0){ // Carrier
    s=`<path d="M2,1.4 L${W-6},1.4 L${W-1},3.2 L${W-1},6.8 L${W-6},8.6 L2,8.6 Z" fill="#6c7886" stroke="#d9e2ea" stroke-width=".35"/>
       <line x1="5" y1="5" x2="${W-5}" y2="5" stroke="#f5f5f5" stroke-width=".4" stroke-dasharray="2.2 1.6"/>
       <line x1="4" y1="7.6" x2="${W*0.55}" y2="2.6" stroke="#f2c84b" stroke-width=".3"/>
       <rect x="${W*0.62}" y="1.6" width="5" height="1.9" rx=".4" fill="#dfe6ec"/>
       <path d="M10,5.9 l2.4,-1 l2.4,1 l-2.4,.3 z M12.2,4.2 v3.4" fill="#cdd6de" stroke="#cdd6de" stroke-width=".35"/>
       <path d="M${W-16},4 l2.4,-1 l2.4,1 l-2.4,.3 z M${W-13.8},2.3 v3.4" fill="#cdd6de" stroke="#cdd6de" stroke-width=".35"/>`;
  }else if(i===1){ // Battleship
    s=hull(W,'#7f8b98')+turret(7)+turret(13)+bridge(18,7)+`<circle cx="27.5" cy="5" r="1.3" fill="#2b2f33"/>`+turret(31);
  }else if(i===2){ // Cruiser
    s=hull(W,'#8e9eaa')+turret(6.5)+bridge(11,6)+`<circle cx="19.5" cy="5" r="1.1" fill="#2b2f33"/>`+turret(23);
  }else if(i===3){ // Submarine
    s=`<path d="M1,5 l2.2,-2.4 v4.8z" fill="#2c3742"/>
       <ellipse cx="${W/2+1}" cy="5" rx="${W/2-2.5}" ry="2.7" fill="#3c4a58" stroke="#aebbc6" stroke-width=".35"/>
       <rect x="${W*0.42}" y="3.6" width="6" height="2.8" rx="1.4" fill="#566676" stroke="#cdd6de" stroke-width=".3"/>
       <line x1="${W*0.42+3}" y1="4.2" x2="${W*0.42+3}" y2="5.8" stroke="#cdd6de" stroke-width=".4"/>
       <circle cx="${W-4}" cy="5" r=".5" fill="#9fb3c4"/>`;
  }else{ // Destroyer
    s=hull(W,'#9ba8b5')+bridge(5,4.5)+turret(13.5);
  }
  const vb=vert?`0 0 10 ${W}`:`0 0 ${W} 10`;
  const g=vert?'<g transform="rotate(90) translate(0,-10)">':'<g>';
  return svgCache[key]=`<svg viewBox="${vb}">${g}${s}</g></svg>`;
}
function drawShips(el,list){
  el.querySelectorAll('.shipart').forEach(n=>n.remove());
  list.forEach(s=>{
    const [r,c]=s.cells[0],len=s.cells.length,v=len>1&&s.cells[1][0]!==r;
    const d=document.createElement('div');
    d.className='shipart'+(s.cls?' '+s.cls:'');
    d.style.gridRow=v?`${r+1} / span ${len}`:`${r+1}`;
    d.style.gridColumn=v?`${c+1}`:`${c+1} / span ${len}`;
    d.innerHTML=shipSVG(s.i,v);
    el.appendChild(d);
  });
}

/* ---------- Names ---------- */
try{$('nameIn').value=localStorage.getItem('warshipsName')||''}catch(e){}
function takeName(){
  const v=$('nameIn').value.trim().slice(0,14);
  if(!v){setStatus('Enter your name first ⚓',true);$('nameIn').focus();return false}
  myName=v;try{localStorage.setItem('warshipsName',v)}catch(e){}
  return true;
}
function updateNames(){
  $('myTitle').textContent=`${myName}'s fleet`;
  $('enemyTitle').textContent=`${oppName}'s waters`;
  updateScore();
}
function updateScore(){$('score').textContent=`${myName} ${score.me} – ${score.them} ${oppName}`}

/* ---------- Connection ---------- */
function newPeer(id){
  if(peer)peer.destroy();
  peer=id?new Peer(id):new Peer();
  const p=peer;
  p.on('disconnected',()=>{if(!p.destroyed&&!(conn&&conn.open))p.reconnect()});
  return p;
}
function host(){if(takeName())openRoom()}
function openRoom(){
  isHost=true;const code=makeCode();setStatus('Creating room…');
  const p=newPeer('wsh-'+code);
  p.on('open',()=>{$('menu').hidden=true;$('hostBox').hidden=false;$('code').textContent=code;setStatus(`Welcome, Captain ${myName}! Send the invite link (or code) to a friend`)});
  p.on('connection',c=>{
    if(conn&&conn.open){c.on('open',()=>{c.send({t:'full'});setTimeout(()=>c.close(),300)});return}
    setupConn(c);
  });
  p.on('error',e=>{if(e.type==='unavailable-id')openRoom();else setStatus('Error: '+e.type)});
}
function join(code){
  if(!takeName())return;
  code=(code||$('codeIn').value).trim().toUpperCase();
  if(code.length<4)return setStatus('Enter the room code');
  isHost=false;setStatus('Connecting to room '+code+'…');
  const p=newPeer();
  p.on('open',()=>setupConn(p.connect('wsh-'+code,{reliable:true})));
  p.on('error',e=>setStatus(e.type==='peer-unavailable'?'Room not found — check the code':'Error: '+e.type));
}
function setupConn(c){
  conn=c;
  c.on('open',()=>{
    send({t:'hello',name:myName});
    iStart=isHost;$('lobby').hidden=true;$('game').hidden=false;updateNames();startPlacement();
  });
  c.on('data',onData);
  c.on('close',lost);c.on('error',lost);
}
function lost(){
  if(phase==='closed')return;
  if(phase==='lobby'){conn=null;return}
  phase='closed';setStatus(`Connection lost — ${oppName} left`);
  $('placeCtrls').hidden=true;$('overBox').hidden=false;
  $('overMsg').textContent='Game ended';$('againBtn').textContent='Back to menu';render();
}
function onData(m){
  switch(m.t){
    case 'hello': oppName=String(m.name||'Friend').slice(0,14)||'Friend'; updateNames(); placeStatus(); break;
    case 'ready': oppReady=true; if(myReady)begin(); else placeStatus(); break;
    case 'shot': receiveShot(m.r,m.c); break;
    case 'result': applyResult(m); break;
    case 'reveal': m.ships.forEach((cells,i)=>{if(!enemyShips.some(s=>s.i===i))enemyShips.push({i,cells,cls:'ghost'})}); render(); break;
    case 'rematch': if(phase==='over')startPlacement(); break;
    case 'full': phase='lobby';$('game').hidden=true;$('lobby').hidden=false;setStatus('That room already has two players'); break;
  }
}

/* ---------- Placement ---------- */
function cellsFor(r,c,len,h){const a=[];for(let i=0;i<len;i++)a.push(h?[r,c+i]:[r+i,c]);return a}
function fits(cells){return cells.every(([r,c])=>r>=0&&r<N&&c>=0&&c<N&&myGrid[r][c]===-1)}
function place(i,cells){ships[i]={cells,hits:0};cells.forEach(([r,c])=>myGrid[r][c]=i)}
function removeShip(i){ships[i].cells.forEach(([r,c])=>myGrid[r][c]=-1);ships[i]=undefined}
function nextIdx(){for(let i=0;i<SHIPS.length;i++)if(!ships[i])return i;return -1}

function startPlacement(){
  phase='place';myGrid=grid(-1);incoming=grid(0);enemy=grid(0);ships=[];enemyShips=[];placingIdx=0;
  myReady=oppReady=false;
  $('placeCtrls').hidden=false;$('overBox').hidden=true;$('enemyWrap').classList.add('dim');log('');
  updateScore();placeStatus();render();
}
function placeStatus(){
  if(phase!=='place')return;
  if(myReady)return setStatus(`Waiting for ${oppName} to place their ships…`);
  $('readyBtn').disabled=placingIdx!==-1;
  setStatus(placingIdx===-1?'Fleet placed! Press Ready when happy.'
    :`Place your ${NAMES[placingIdx]} (${SHIPS[placingIdx]}) — ${horiz?'horizontal':'vertical'}. R to rotate.`);
  if(oppReady)log(`${oppName} is ready ✔`);
}
function rotate(){horiz=!horiz;placeStatus();render()}
function rnd(n){return Math.floor(Math.random()*n)}
function randomize(){
  myGrid=grid(-1);ships=[];
  SHIPS.forEach((len,i)=>{let cells;do{cells=cellsFor(rnd(N),rnd(N),len,Math.random()<.5)}while(!fits(cells));place(i,cells)});
  placingIdx=-1;placeStatus();render();
}
function clickMine(r,c){
  if(phase!=='place'||myReady)return;
  const i=myGrid[r][c];
  if(i>=0){removeShip(i);placingIdx=i}
  else if(placingIdx>=0){
    const cells=cellsFor(r,c,SHIPS[placingIdx],horiz);
    if(!fits(cells))return;
    place(placingIdx,cells);placingIdx=nextIdx();
  }
  placeStatus();render();
}
function ready(){
  if(placingIdx!==-1||myReady)return;
  myReady=true;hover=null;send({t:'ready'});$('placeCtrls').hidden=true;
  if(oppReady)begin();else{placeStatus();render()}
}

/* ---------- Battle ---------- */
function begin(){
  phase='play';myTurn=iStart;$('placeCtrls').hidden=true;$('enemyWrap').classList.remove('dim');
  log(myTurn?'You fire first. Hit a ship and you get another shot!':`${oppName} fires first. A hit means another shot!`);
  turnStatus();render();
}
function turnStatus(){myTurn?setStatus('🎯 Your turn — click the enemy waters',true):setStatus(`⏳ ${oppName}'s turn…`)}
function clickEnemy(r,c){
  if(phase!=='play'||!myTurn||enemy[r][c]!==0)return;
  myTurn=false;enemy[r][c]=5;send({t:'shot',r,c});setStatus('Firing…');render();
}
function receiveShot(r,c){
  const i=myGrid[r][c],hit=i>=0;incoming[r][c]=hit?2:1;
  let sunk=null,name=null;
  if(hit){ships[i].hits++;if(ships[i].hits===SHIPS[i]){sunk=ships[i].cells;name=NAMES[i]}}
  const over=ships.every((s,k)=>s.hits===SHIPS[k]);
  send({t:'result',r,c,hit,sunk,idx:sunk?i:null,name,over});
  log(name?`${oppName} sank your ${name}!`:hit?`${oppName} hit one of your ships!`:`${oppName} missed.`);
  if(over){render();return endGame(false)}
  if(hit){myTurn=false;setStatus(`💥 ${oppName} hit — they fire again…`)}
  else{myTurn=true;turnStatus()}
  render();
}
function applyResult(m){
  enemy[m.r][m.c]=m.hit?2:1;
  if(m.sunk){m.sunk.forEach(([r,c])=>enemy[r][c]=3);enemyShips.push({i:m.idx,cells:m.sunk,cls:'sunk'})}
  log(m.name?`You sank their ${m.name}! 💥`:m.hit?'Hit! 🔥':'Miss 🌊');
  if(m.over){send({t:'reveal',ships:ships.map(s=>s.cells)});render();return endGame(true)}
  if(m.hit){myTurn=true;setStatus('🎯 Hit! Fire again!',true)}
  else{myTurn=false;turnStatus()}
  render();
}
function endGame(won){
  phase='over';iStart=!won;won?score.me++:score.them++;updateScore();
  setStatus(won?`🏆 Victory! You sank ${oppName}'s whole fleet!`:`💀 Defeat — ${oppName} sank your fleet.`,won);
  $('overMsg').textContent=won?`${myName} wins!`:`${oppName} wins!`;$('againBtn').textContent='Play again';
  $('overBox').hidden=false;render();
}

/* ---------- Drawing ---------- */
function build(el,fn,hov){
  const a=[];
  for(let r=0;r<N;r++){a.push([]);for(let c=0;c<N;c++){
    const d=document.createElement('div');d.className='cell';d.style.gridArea=`${r+1} / ${c+1}`;
    d.onclick=()=>fn(r,c);
    if(hov)d.onmouseenter=()=>{hover=[r,c];render()};
    el.appendChild(d);a[r].push(d);
  }}
  if(hov)el.onmouseleave=()=>{hover=null;render()};
  return a;
}
const myCells=build($('mine'),clickMine,true),enCells=build($('enemy'),clickEnemy,false);
function render(){
  if(!myGrid)return;
  const bad=new Set();let ghost=null;
  if(phase==='place'&&!myReady&&hover&&placingIdx>=0){
    const cells=cellsFor(hover[0],hover[1],SHIPS[placingIdx],horiz);
    if(fits(cells))ghost={i:placingIdx,cells,cls:'ghost'};
    else cells.forEach(([r,c])=>{if(r<N&&c<N)bad.add(r*N+c)});
  }
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    let k='cell';
    if(incoming[r][c]===2)k+=myGrid[r][c]>=0&&ships[myGrid[r][c]].hits===SHIPS[myGrid[r][c]]?' sunk hit':' hit';
    else if(incoming[r][c]===1)k+=' miss';
    if(bad.has(r*N+c))k+=' bad';
    myCells[r][c].className=k;
    const v=enemy[r][c];
    let e='cell'+['',' miss',' hit',' sunk hit','',' pending'][v];
    if(v===0&&phase==='play'&&myTurn)e+=' target';
    enCells[r][c].className=e;
  }
  const mine=[];
  ships.forEach((s,i)=>{if(s)mine.push({i,cells:s.cells,cls:s.hits===SHIPS[i]?'sunk':''})});
  if(ghost)mine.push(ghost);
  drawShips($('mine'),mine);
  drawShips($('enemy'),enemyShips);
  $('myFleet').innerHTML=NAMES.map((n,i)=>`<span class="${ships[i]&&ships[i].hits===SHIPS[i]?'gone':''}">${n}</span>`).join('');
  $('enemyFleet').innerHTML=NAMES.map((n,i)=>`<span class="${enemyShips.some(s=>s.i===i&&s.cls==='sunk')?'gone':''}">${n}</span>`).join('');
}

/* ---------- Wiring ---------- */
$('hostBtn').onclick=host;
$('joinBtn').onclick=()=>join();
$('codeIn').onkeydown=e=>{if(e.key==='Enter')join()};
$('nameIn').onkeydown=e=>{if(e.key==='Enter'&&$('codeIn').value.trim())join()};
$('copyBtn').onclick=()=>{
  const link=location.origin+location.pathname+'?room='+$('code').textContent;
  navigator.clipboard.writeText(link).then(()=>{$('copyBtn').textContent='Copied! ✔'},()=>prompt('Copy this link:',link));
};
$('rotBtn').onclick=rotate;
$('randBtn').onclick=randomize;
$('clearBtn').onclick=()=>{myGrid=grid(-1);ships=[];placingIdx=0;placeStatus();render()};
$('readyBtn').onclick=ready;
$('againBtn').onclick=()=>{if(phase==='closed')location.href=location.pathname;else{send({t:'rematch'});startPlacement()}};
document.onkeydown=e=>{if(e.target.tagName!=='INPUT'&&(e.key==='r'||e.key==='R')&&phase==='place')rotate()};

const room=new URLSearchParams(location.search).get('room');
if(room){
  $('codeIn').value=room.toUpperCase();$('hostBtn').hidden=true;
  document.querySelector('.or').textContent='Joining room '+room.toUpperCase();
  setStatus('Enter your name, then press Join',true);$('nameIn').focus();
}
</script>
</body>
</html>
